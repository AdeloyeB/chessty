[package]
name = "chess-gamble-desktop"
version = "0.1.0"
description = "Chess Gamble — Real-money chess prediction and betting platform"
authors = ["Chess Gamble"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api enables transparent windows on macOS for dynamically created windows.
# Note: This prevents App Store submission, but enables true overlay transparency.
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# url parses URLs into their components (scheme, host, path, query, etc.).
# We use this to parse deep link URLs like "chkmate://challenge/abc123".
url = "2"
# Tokio is an async runtime — it provides async-aware synchronization primitives
# like Mutex that can be held across .await points. The standard library's Mutex
# can't be used with async code because it would block the entire thread.
# Features:
# - "sync": Async-aware synchronization primitives (Mutex, RwLock, channels)
# - "time": Timeout functionality for preventing engine hangs
# - "process": Async process spawning (used by anticheat to scan running processes)
tokio = { version = "1", features = ["sync", "time", "process"] }
# num_cpus detects the number of CPU cores (physical and logical) on the system.
# We use this to configure Stockfish with the optimal number of threads — more
# threads = faster analysis, but we need to know how many cores are available.
num_cpus = "1.16"
# tokio-util provides additional async utilities like CancellationToken — a way to
# signal that a long-running task should stop. Think of it like a "stop button"
# that the frontend can press to cancel an analysis.
tokio-util = "0.7"
# uuid generates unique identifiers. We use it to give each analysis a unique ID
# so the frontend can track and cancel specific analyses.
uuid = { version = "1", features = ["v4"] }

# macOS-specific dependencies for native window styling (rounded corners, traffic lights)
# These use Apple's Cocoa framework APIs via the cocoa and objc crates.
# - cocoa: Rust bindings to macOS's Cocoa framework (NSWindow, NSView, etc.)
# - objc: Low-level Objective-C runtime bindings for calling macOS APIs
# - lazy_static: Lazily initialized statics for caching window styling state
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
lazy_static = "1.4"

[dev-dependencies]
# mockall generates mock implementations of traits for testing.
# We use it to mock Stockfish process interactions and Tauri APIs.
mockall = "0.12"
# tokio-test provides utilities for testing async code with tokio.
# Used for testing engine commands and lifecycle management.
tokio-test = "0.4"
# tempfile creates temporary files/directories for tests that need file I/O.
# Useful for testing configuration persistence and sidecar paths.
tempfile = "3"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
