[package]
name = "chess-gamble-desktop"
version = "0.1.0"
description = "Chess Gamble — Real-money chess prediction and betting platform"
authors = ["Chess Gamble"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tokio is an async runtime — it provides async-aware synchronization primitives
# like Mutex that can be held across .await points. The standard library's Mutex
# can't be used with async code because it would block the entire thread.
# Features:
# - "sync": Async-aware synchronization primitives (Mutex, RwLock, channels)
# - "time": Timeout functionality for preventing engine hangs
# - "process": Async process spawning (used by anticheat to scan running processes)
tokio = { version = "1", features = ["sync", "time", "process"] }
# num_cpus detects the number of CPU cores (physical and logical) on the system.
# We use this to configure Stockfish with the optimal number of threads — more
# threads = faster analysis, but we need to know how many cores are available.
num_cpus = "1.16"
# tokio-util provides additional async utilities like CancellationToken — a way to
# signal that a long-running task should stop. Think of it like a "stop button"
# that the frontend can press to cancel an analysis.
tokio-util = "0.7"
# uuid generates unique identifiers. We use it to give each analysis a unique ID
# so the frontend can track and cancel specific analyses.
uuid = { version = "1", features = ["v4"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
